name: Fetch 2027 grad jobs

on:
  schedule:
    # Every 2 hours. GitHub only runs scheduled workflows on the default
    # branch, so this becomes active once this branch is merged to main.
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest job listings
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
        run: node scripts/fetch-jobs.mjs

      - name: Email notification for new jobs
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: node scripts/send-email.mjs

      - name: Commit updated job data
        run: |
          git config user.name "grad-jobs-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data/jobs.json site/data/new-jobs.json site/data/meta.json
          git diff --cached --quiet || git commit -m "Update job listings"
          git push
